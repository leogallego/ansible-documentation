name: Build AI Docs

on:
  push:
    branches:
      - devel
      - "stable-*"
    paths:
      - "docs/docsite/rst/**"
      - "docs/bin/build_ai_docs.py"
      - "docs/ai-docs-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ai-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox pyyaml

      - name: Clone ansible-core content
        run: nox -s clone-core

      - name: Build AI docs
        run: python docs/bin/build_ai_docs.py

      - name: Publish to ai-docs branch
        run: |
          cd docs/docsite/ai-docs
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ai-docs
          git add .
          git commit -m "Update AI docs from ${GITHUB_SHA::8}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin ai-docs
